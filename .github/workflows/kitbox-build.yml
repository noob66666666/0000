name: Build KitBox addon

on:
  push:
    paths:
      - 'KitBox_Project/**'
      - '.github/workflows/kitbox-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          find KitBox_Project/behavior_pack KitBox_Project/resource_pack -type f -name '*.json' -print0 |
            while IFS= read -r -d '' file; do
              python -m json.tool "$file" >/dev/null
            done

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find KitBox_Project/behavior_pack/scripts -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done

      - name: Build MCADDON
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/bp dist/rp

          # Minecraft's .mcaddon format is a ZIP container of .mcpack files.
          # The raw behavior/resource pack folders remain the editable project source.
          (
            cd KitBox_Project/behavior_pack
            zip -qr ../../dist/bp/Kitbox_Behavior.mcpack .
          )
          (
            cd KitBox_Project/resource_pack
            zip -qr ../../dist/rp/Kitbox_Resource.mcpack .
          )

          cd dist
          zip -q Kitbox.mcaddon bp/Kitbox_Behavior.mcpack rp/Kitbox_Resource.mcpack
          cd ..

          unzip -l dist/Kitbox.mcaddon
          unzip -Z1 dist/Kitbox.mcaddon | grep -q '^bp/Kitbox_Behavior.mcpack$'
          unzip -Z1 dist/Kitbox.mcaddon | grep -q '^rp/Kitbox_Resource.mcpack$'

          rm -rf dist/inspect
          mkdir -p dist/inspect/bp dist/inspect/rp
          unzip -q dist/bp/Kitbox_Behavior.mcpack -d dist/inspect/bp
          unzip -q dist/rp/Kitbox_Resource.mcpack -d dist/inspect/rp
          test -f dist/inspect/bp/manifest.json
          test -f dist/inspect/rp/manifest.json
          test -f dist/inspect/bp/items/kitbox.json

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kitbox-mcaddon
          path: dist/Kitbox.mcaddon
          if-no-files-found: error
