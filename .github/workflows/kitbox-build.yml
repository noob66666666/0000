name: Build KitBox addon

on:
  push:
    paths:
      - 'KitBox_Project/**'
      - '.github/workflows/kitbox-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          find KitBox_Project/behavior_pack KitBox_Project/resource_pack -type f -name '*.json' -print0 |
            while IFS= read -r -d '' file; do
              python -m json.tool "$file" >/dev/null
            done

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find KitBox_Project/behavior_pack/scripts -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done

      - name: Build MCADDON
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/inspect/bp dist/inspect/rp

          # A Bedrock .mcaddon is a ZIP container carrying the behavior pack
          # and resource pack as separate .mcpack files.
          (
            cd KitBox_Project/behavior_pack
            zip -qr ../../dist/Kitbox_Behavior.mcpack .
          )
          (
            cd KitBox_Project/resource_pack
            zip -qr ../../dist/Kitbox_Resource.mcpack .
          )

          cd dist
          zip -q Kitbox.mcaddon Kitbox_Behavior.mcpack Kitbox_Resource.mcpack
          cd ..

          # Verify the addon contains the two packs at its root, not raw pack folders.
          unzip -Z1 dist/Kitbox.mcaddon | grep -Fxq 'Kitbox_Behavior.mcpack'
          unzip -Z1 dist/Kitbox.mcaddon | grep -Fxq 'Kitbox_Resource.mcpack'
          if unzip -Z1 dist/Kitbox.mcaddon | grep -Eq '(^|/)behavior_pack/|(^|/)resource_pack/'; then
            echo 'ERROR: raw behavior_pack/resource_pack folders must not be embedded in .mcaddon'
            exit 1
          fi

          # Verify both embedded packs are valid and contain their required files.
          unzip -q dist/Kitbox_Behavior.mcpack -d dist/inspect/bp
          unzip -q dist/Kitbox_Resource.mcpack -d dist/inspect/rp
          test -f dist/inspect/bp/manifest.json
          test -f dist/inspect/rp/manifest.json
          test -f dist/inspect/bp/items/kitbox.json
          test -f dist/inspect/bp/scripts/main.js
          test -f dist/inspect/rp/textures/item_texture.json
          test -f dist/inspect/rp/textures/items/kitbox.png

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kitbox-mcaddon
          path: dist/Kitbox.mcaddon
          if-no-files-found: error
