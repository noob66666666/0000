name: Build KitBox addon

on:
  push:
    paths:
      - 'KitBox_Project/**'
      - '.github/workflows/kitbox-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          find KitBox_Project/behavior_pack KitBox_Project/resource_pack -type f -name '*.json' -print0 |
            while IFS= read -r -d '' file; do
              python -m json.tool "$file" >/dev/null
            done

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find KitBox_Project/behavior_pack/scripts -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done

      - name: Build MCADDON
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          (
            cd KitBox_Project
            zip -qr ../dist/Kitbox.mcaddon behavior_pack resource_pack
          )
          unzip -l dist/Kitbox.mcaddon
          unzip -Z1 dist/Kitbox.mcaddon | grep -q '^behavior_pack/manifest.json$'
          unzip -Z1 dist/Kitbox.mcaddon | grep -q '^resource_pack/manifest.json$'
          if unzip -Z1 dist/Kitbox.mcaddon | grep -Eq '\.mcpack$'; then
            echo 'ERROR: .mcpack files must not be embedded in the .mcaddon.'
            exit 1
          fi

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kitbox-mcaddon
          path: dist/Kitbox.mcaddon
          if-no-files-found: error
